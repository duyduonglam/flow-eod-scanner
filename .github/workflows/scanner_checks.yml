name: Scanner Checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/scanner/pyproject.toml
      - name: Install scanner
        run: pip install -e 'apps/scanner[dev]'
      - name: Run deterministic scanner tests
        run: pytest -q apps/scanner/tests
