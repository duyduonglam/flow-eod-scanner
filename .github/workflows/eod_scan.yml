name: FLOW EOD Scan
on:
  schedule:
    # 16:00 Asia/Ho_Chi_Minh = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      market_date:
        description: Optional market date override in YYYY-MM-DD
        required: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner
        run: pip install -e 'apps/scanner[dev,data]'
      - name: Run deterministic tests
        run: pytest -q apps/scanner/tests
      - name: Run EOD scan and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREANT_API_KEY: ${{ secrets.FIREANT_API_KEY }}
          OPENSTOCK_API_KEY: ${{ secrets.OPENSTOCK_API_KEY }}
          REQUESTED_MARKET_DATE: ${{ github.event.inputs.market_date }}
          TZ: Asia/Ho_Chi_Minh
        run: |
          if [ -n "$REQUESTED_MARKET_DATE" ]; then
            python -m flow_scanner.cli --date "$REQUESTED_MARKET_DATE" --max-lookback-days 1 --retry-sleep-seconds 0 --max-rate-limit-retries 0
          else
            python -m flow_scanner.cli --max-lookback-days 1 --retry-sleep-seconds 0 --max-rate-limit-retries 0
          fi
