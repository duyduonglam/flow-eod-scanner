[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-eod-scanner"
version = "0.1.0"
description = "EOD FLOW scanner for Vietnam equities"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
data = ["vnstock>=3.3"]
dev = ["pytest>=8.0"]

[project.scripts]
flow-eod-scan = "flow_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
